name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, lint, audit and validate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            prototype/api/requirements.txt
            prototype/api/requirements-dev.txt
            prototype/api/requirements-trainer.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Test and build web application
        run: |
          npm run test:web
          npm run lint:web
          npm run build

      - name: Create virtual environment and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r prototype/api/requirements-dev.txt

      - name: Run tests
        run: make test

      - name: Run Ruff
        run: make lint

      - name: Run Python security audits
        run: make scan-python

      - name: Generate Python SBOMs
        run: make sbom-python

      - name: Validate OSCAL/control-selection consistency
        run: .venv/bin/python scripts/validate_oscal.py

      - name: Validate Docker Compose
        run: make docker-validate

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            evidence/security-tests/pytest-junit.xml
            evidence/scans/bandit.json
            evidence/scans/pip-audit.json
            evidence/scans/pip-audit-trainer.json
            evidence/sbom/python.cdx.json
            evidence/sbom/trainer-python.cdx.json
