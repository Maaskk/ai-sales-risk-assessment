[tool.pytest.ini_options]
testpaths = ["prototype/api/tests", "prototype/model/tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"prototype/model/train.py" = ["E501"]
"scripts/summarize_evidence.py" = ["E501"]

[tool.bandit]
exclude_dirs = ["prototype/api/tests", ".venv"]
